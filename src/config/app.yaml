api:
  host: 0.0.0.0
  port: 8000
  api_key: secret

  rate_limits:
    requests: 100
    period: 60

socket:
  ping_interval: 20
  timeout: 60
  max_connections: 1000

mongo:
  host: localhost
  port: 27017
  database: matches
  username: admin
  password: secret

history:
  enabled: true
  db_path: ./history.db

cache:
  enabled: true

