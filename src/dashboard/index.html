<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>OddsMaster — Real-time odds &amp; arbitrage</title>

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<!-- Tailwind (script import only, no build step) -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          display: ['Space Grotesk', 'Inter', 'sans-serif'],
          sans: ['Inter', 'sans-serif'],
          mono: ['JetBrains Mono', 'monospace'],
        },
      },
    },
  };
</script>

<!-- App styles -->
<link rel="stylesheet" href="css/app.css" />

<!-- Vue 3 (global build, script import only) -->
<script src="https://unpkg.com/vue@3.4.31/dist/vue.global.prod.js"></script>
<!-- Socket.IO client -->
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
</head>
<body class="min-h-screen" :class="{ compact: false }">

<div id="app" v-cloak class="min-h-screen flex flex-col" :class="{ compact: store.state.settings.compactMode }">

  <navbar @refresh="handleRefresh" @toggle-notifications="showNotifs = !showNotifs" @toggle-settings="showSettings = true"></navbar>

  <main class="max-w-[1600px] w-full mx-auto px-4 sm:px-6 py-5 flex-1 flex flex-col gap-4">
    <server-status></server-status>
    <stats-cards></stats-cards>
    <filter-panel></filter-panel>
    <match-table @open-history="openHistory"></match-table>
  </main>

  <footer class="text-center text-[11px] text-[var(--text-muted)] py-4 font-mono">
    OddsMaster · demo data streams when no live backend is connected
  </footer>

  <notification-panel v-if="showNotifs" @close="showNotifs = false"></notification-panel>
  <settings-modal :visible="showSettings" @close="showSettings = false"></settings-modal>
  <history-modal :match="historyMatch" @close="historyMatch = null"></history-modal>

</div>

<!-- ============ App modules (plain script tags, no bundler) ============ -->
<script src="js/api.js"></script>
<script src="js/demo.js"></script>
<script src="js/socket.js"></script>
<script src="js/store.js"></script>
<script src="js/filters.js"></script>
<script src="js/charts.js"></script>
<script src="js/notifications.js"></script>

<script src="components/Navbar.js"></script>
<script src="components/ServerStatus.js"></script>
<script src="components/StatsCards.js"></script>
<script src="components/FilterPanel.js"></script>
<script src="components/MatchRow.js"></script>
<script src="components/MatchTable.js"></script>
<script src="components/HistoryModal.js"></script>
<script src="components/NotificationPanel.js"></script>
<script src="components/SettingsModal.js"></script>

<script>
  const { createApp, ref, onMounted, onBeforeUnmount } = Vue;

  const App = {
    setup() {
      const store = Store;
      const showNotifs = ref(false);
      const showSettings = ref(false);
      const historyMatch = ref(null);
      let simTimer = null, heartbeatTimer = null;

      function openHistory(match) { historyMatch.value = match; }

      async function loadInitial() {
        store.state.loadingInitial = true;
        try {
          const data = await Api.getMatches({});
          store.setInitialMatches(data);
        } catch (e) {
          console.error('Initial load failed', e);
          store.state.loadingInitial = false;
        }
      }

      async function handleRefresh() {
        try {
          const data = await Api.getMatches({
            category: store.state.filters.category || undefined,
            sources: store.state.filters.sources,
          });
          store.setInitialMatches(data);
        } catch (e) {
          console.error('Refresh failed', e);
        }
      }

      function wireSocket() {
        SocketBridge.on('state', (s) => { store.state.connection = s; });
        SocketBridge.on('servers_update', (payload) => store.applyServersUpdate(payload));
        SocketBridge.on('update', (payload) => store.applyUpdate(payload));
        const sock = SocketBridge.connect(); // same-origin by default; point at your Socket.IO server URL if different

        // No real Socket.IO server reachable from this static preview →
        // seed demo servers/matches and simulate the same event contract
        // locally so the dashboard is fully explorable.
        setTimeout(() => {
          if (!SocketBridge.isConnected()) {
            store.state.connection = 'connected';
            store.applyServersUpdate(Demo.genServers());
            if (!store.state.matches.size) loadInitial();
            simTimer = Demo.startLiveSimulation(store);
            heartbeatTimer = Demo.startServerHeartbeat(store);
          }
        }, 900);
      }

      function onKeydown(e) {
        if (store.state.settings.refreshShortcut && (e.key === 'r' || e.key === 'R') &&
            !['INPUT', 'SELECT', 'TEXTAREA'].includes(document.activeElement.tagName)) {
          handleRefresh();
        }
        if (e.key === 'Escape') { showNotifs.value = false; showSettings.value = false; historyMatch.value = null; }
      }

      onMounted(() => {
        loadInitial();
        wireSocket();
        window.addEventListener('keydown', onKeydown);
      });
      onBeforeUnmount(() => {
        window.removeEventListener('keydown', onKeydown);
        clearInterval(simTimer);
        clearInterval(heartbeatTimer);
      });

      return { store, showNotifs, showSettings, historyMatch, openHistory, handleRefresh };
    },
  };

  const app = createApp(App);
  app.component('navbar', Navbar);
  app.component('server-status', ServerStatus);
  app.component('stats-cards', StatsCards);
  app.component('filter-panel', FilterPanel);
  app.component('match-row', MatchRow);
  app.component('match-table', MatchTable);
  app.component('history-modal', HistoryModal);
  app.component('notification-panel', NotificationPanel);
  app.component('settings-modal', SettingsModal);
  app.mount('#app');
</script>

</body>
</html>
